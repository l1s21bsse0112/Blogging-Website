name: PR Validation

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    name: Linting Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install --save-dev stylelint stylelint-config-standard htmlhint

      - name: Lint HTML Files
        run: npx htmlhint src/**/*.html

      - name: Lint CSS Files
        run: npx stylelint styles/**/*.css

  build:
    name: Build Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install --save-dev parcel

      - name: Build Project
        run: npx parcel build src/**/*.html --dist-dir dist
